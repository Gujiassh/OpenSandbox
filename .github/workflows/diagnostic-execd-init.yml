name: Diagnostic Execd Init Census

on:
  push:
    branches: [diagnostics/execd-init-census-20260920]
    paths:
      - .github/workflows/diagnostic-execd-init.yml
      - scripts/diagnostics/**

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            sha: 5ac4e576855b2a0b617ed67c24f4f90075f416b7
          - label: head
            sha: e6dbf6b7f734f33dc10f38ac2c10331b8c38ebe5
    env:
      OPENSANDBOX_SANDBOX_DEFAULT_IMAGE: opensandbox/code-interpreter@sha256:64cd01f03f54ba347d1a1310dcbc18ac5cb17d01714e23b4ea4b840fbb0d6623
      RADAR_DIAGNOSTICS_DIR: ${{ github.workspace }}/evidence
      RADAR_SOURCE_SHA: ${{ matrix.sha }}
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: opensandbox-group/OpenSandbox
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - name: Record source and native environment
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p "$RADAR_DIAGNOSTICS_DIR"
          test "$(git rev-parse HEAD)" = "$RADAR_SOURCE_SHA"
          {
            printf 'source='; git rev-parse HEAD
            printf 'tree='; git rev-parse 'HEAD^{tree}'
            printf 'harness='; git -C ../harness rev-parse HEAD
            uname -a
            docker version
            uv --version
            df -h
          } > "$RADAR_DIAGNOSTICS_DIR/environment.txt"
          git diff --exit-code
          docker pull "$OPENSANDBOX_SANDBOX_DEFAULT_IMAGE"
          docker image inspect "$OPENSANDBOX_SANDBOX_DEFAULT_IMAGE" \
            --format '{{.Id}}' > "$RADAR_DIAGNOSTICS_DIR/expected-image-id.txt"
      - name: Build egress and configure original bridge setup
        working-directory: source
        run: |
          set -euo pipefail
          docker build -t opensandbox/egress:local -f components/egress/Dockerfile .
          cat > ~/.sandbox.toml <<'TOML'
          [server]
          host = "127.0.0.1"
          port = 8080
          api_key = ""
          [log]
          level = "INFO"
          [runtime]
          type = "docker"
          execd_image = "opensandbox/execd:local"
          execd_run_as_init = true
          [egress]
          image = "opensandbox/egress:local"
          mode = "dns+nft"
          [docker]
          network_mode = "bridge"
          [storage]
          allowed_host_paths = ["/tmp/opensandbox-e2e"]
          [renew_intent]
          enabled = true
          min_interval_seconds = 60
          TOML
      - name: Run unchanged eleven-test native suite with observer
        working-directory: source
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$GITHUB_WORKSPACE/harness/scripts/diagnostics"
          export PYTEST_PLUGINS=execd_init_observer
          export PYTEST_ADDOPTS="--junitxml=$RADAR_DIAGNOSTICS_DIR/original-suite.xml"
          bash scripts/python-execd-init-e2e.sh 2>&1 | tee "$RADAR_DIAGNOSTICS_DIR/suite.log"
          pipeline=("${PIPESTATUS[@]}")
          set -e
          result=${pipeline[0]}
          test "${pipeline[1]}" -eq 0 || exit 1
          printf '%s\n' "$result" > "$RADAR_DIAGNOSTICS_DIR/script-exit-code.txt"
          test -s "$RADAR_DIAGNOSTICS_DIR/diagnostics.json" || exit 1
          test -s "$RADAR_DIAGNOSTICS_DIR/original-suite.xml" || exit 1
          exit "$result"
      - name: Collect bounded native artifacts
        if: always()
        working-directory: source
        run: |
          mkdir -p "$RADAR_DIAGNOSTICS_DIR"
          cp server/server.log "$RADAR_DIAGNOSTICS_DIR/server.log" 2>/dev/null || true
          cp -r /tmp/opensandbox-e2e/logs "$RADAR_DIAGNOSTICS_DIR/execd-logs" 2>/dev/null || true
          docker image ls --digests > "$RADAR_DIAGNOSTICS_DIR/docker-images.txt"
          git status --short > "$RADAR_DIAGNOSTICS_DIR/source-status.txt"
          git diff -- tests/python/tests/test_execd_init_e2e.py scripts/python-execd-init-e2e.sh \
            components/execd > "$RADAR_DIAGNOSTICS_DIR/tested-source.diff"
          for project in server tests/python; do
            if [ -x "$project/.venv/bin/python" ]; then
              uv pip freeze --python "$project/.venv/bin/python" \
                > "$RADAR_DIAGNOSTICS_DIR/$(basename "$project")-dependencies.txt"
              "$project/.venv/bin/python" --version
            fi
          done
      - name: Upload original outcomes and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: execd-init-${{ matrix.label }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 5
      - name: Clean up disposable runner containers
        if: always()
        run: |
          docker ps -aq --filter label=opensandbox | xargs -r docker rm -f
